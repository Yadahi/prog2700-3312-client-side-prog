<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <button id="chatbot-toggler">
      <span class="material-symbols-outlined"> mode_comment </span>
      <span class="material-symbols-outlined"> close </span>
    </button>
    <div class="chatbot-popup">
      <!-- Chatbot Header -->
      <div class="chat-header">
        <div class="header-info">
          <span class="chatbot-logo material-symbols-outlined"> robot </span>
          <h2 class="logo-text">Chatbot</h2>
        </div>
        <div class="header-buttons">
          <button
            id="clear-chat"
            class="material-symbols-outlined"
            title="New chat"
          >
            refresh
          </button>
          <button id="close-chatbot" class="material-symbols-outlined">
            keyboard_arrow_down
          </button>
        </div>
      </div>
      <!-- Chatbot Body -->
      <div class="chat-body">
        <div class="message bot-message">
          <span class="bot-avatar material-symbols-outlined"> robot </span>
          <div class="message-text">
            Hey there <br />
            How can I help you?
          </div>
        </div>
      </div>
      <!-- Chatbot Footer -->
      <div class="chat-footer">
        <form action="#" class="chat-form">
          <textarea
            placeholder="Message..."
            id=""
            class="message-input"
            required
          ></textarea>
          <div class="chat-controls">
            <button
              type="button"
              class="material-symbols-outlined"
              id="emoji-picker"
            >
              sentiment_satisfied
            </button>
            <div class="file-upload-wrapper">
              <input type="file" accept="images/*" id="file-input" hidden />
              <img src="#" />
              <button
                type="button"
                id="file-upload"
                class="material-symbols-outlined"
              >
                attach_file
              </button>
              <button
                type="button"
                id="file-cancel"
                class="material-symbols-outlined"
              >
                close
              </button>
            </div>
            <button
              type="submit"
              id="send-message"
              class="material-symbols-outlined"
            >
              arrow_upward
            </button>
          </div>
        </form>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/emoji-mart@latest/dist/browser.js"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>

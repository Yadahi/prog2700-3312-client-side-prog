<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>Assignment 8</title>
  </head>
  <body>
    <div class="message-app">
      <h1>Message App</h1>
      <label for="message">
        <textarea
          id="message-input"
          class="message-input"
          rows="5"
          cols="30"
          placeholder="Type your message here"
        ></textarea>
      </label>
      <div class="button-group">
        <button class="show-message-btn" id="show-message-btn">
          Show Message
        </button>
        <button class="change-color-btn" id="change-color-btn">
          Change Card Color
        </button>
        <button class="add-note-btn" id="add-note-btn">Add Note</button>
        <button class="remove-note-btn" id="remove-note-btn">
          Remove Note
        </button>
        <button class="reset-btn" id="reset-btn">Reset</button>
      </div>
      <div class="message-card-section" id="message-card-section">
        Message card will be rendered here
      </div>
    </div>
  </body>
</html>

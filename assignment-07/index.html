<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>Assignment 7</title>
  </head>
  <body>
    <main class="app">
      <span id="countdown">0</span>
      <section class="header-section">
        <h1 class="app-title">Simple Grocery Store</h1>
      </section>

      <section class="form-section">
        <form id="list-form" class="grocery-form">
          <ul id="item-list" class="grocery-list"></ul>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">
              Calculate Total
            </button>
            <button type="button" id="print-btn" class="btn btn-secondary">
              Print Receipt
            </button>
            <button type="button" id="reset-btn" class="btn btn-reset">
              Reset Cart
            </button>
          </div>
        </form>
        <div class="total-display">
          <span class="total-label">Total:</span>
          <span id="total-value"></span>
        </div>
      </section>
      <section class="receipt-section">
        <h2 class="receipt-title">Receipt</h2>
        <pre id="receipt-output" class="receipt-box"></pre>
      </section>
    </main>
  </body>
</html>
